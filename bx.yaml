filetype: bx

detect:
    filename: "\\.bx$"

rules:
    # Comments - win over everything else via position at end
    - boxedlang.comment:
        start: "//"
        end: "$"
        rules: []

    # Keywords anchored to line start - prevents short aliases
    # (m/s/a/t/i/e/d/j/b) from firing later in the line
    - boxedlang.statement: "(?im)^\\s*(box|b|say|s|ask|a|math|m|test|t|jumpif|ji|jump|j|if|i|wait|wt|del|d|weigh|wh|premark|mark|mk|end|e|clear|cls|return|ret|import|imp)\\b"

    # namespace.func calls and ret- box names
    - boxedlang.type: "[A-Za-z_][A-Za-z0-9_-]*\\.[A-Za-z_][A-Za-z0-9_-]*"
    - boxedlang.type: "\\bret-[A-Za-z0-9_]+"

    # $variable references
    - boxedlang.dollar: "\\$[A-Za-z0-9_#?][A-Za-z0-9_#?-]*"

    # Numbers
    - boxedlang.number: "\\b[0-9]+#?\\b"

    # Operators
    - boxedlang.special: "==|!=|>=|<=|>|<|\\+|-|\\*|/|%"

    # | field separator
    - boxedlang.pipe: "\\|"

    # \/ escape sequence and ~
    - boxedlang.symbol: "\\\\/|~|\\?"
